name: Supabase Keep-Alive

# Supabase pauses free-plan projects without a few DB requests each day,
# not just once a week, so this pings twice a day to stay safely active.
on:
  schedule:
    - cron: "11 6 * * *" # daily, 06:11 UTC
    - cron: "41 17 * * *" # daily, 17:41 UTC
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl --fail --silent --show-error \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/games?select=id&limit=1"
