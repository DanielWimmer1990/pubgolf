name: Supabase Keep-Alive

# Supabase pauses free-plan projects after 7 days without activity.
# This pings the database twice a week so it never goes idle that long.
on:
  schedule:
    - cron: "13 6 * * 1,4" # Monday and Thursday, 06:13 UTC
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl --fail --silent --show-error \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/games?select=id&limit=1"
